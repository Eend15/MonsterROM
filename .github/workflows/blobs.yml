name: Update prebuilt blobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "Galaxy A52 (a52qnsxx)"
            device: "a52qnsxx"
            firmware: "SM-A525F/EUX/352938771234569"
          - module: "Galaxy A53 5G (a53xtfn)"
            device: "a53xtfn"
            firmware: "SM-S536DL/TFA/352574701234567"
          - module: "Galaxy A73 5G (a73xqxx)"
            device: "a73xqxx"
            firmware: "SM-A736B/XME/352828291234563"
          - module: "Galaxy S22 Ultra (Snapdragon) (b0qxxx)"
            device: "b0qxxx"
            firmware: "SM-S908E/TUR/350280381234560"
          - module: "Galaxy S22 Ultra (Exynos) (b0sxxx)"
            device: "b0sxxx"
            firmware: "SM-S908B/EUX/353074281234565"
          - module: "Galaxy Z Flip4 (b4qxxx)"
            device: "b4qxxx"
            firmware: "SM-F721B/BTE/350525851234569"
          - module: "Galaxy Tab A9+ 5G (gta9pxxx)"
            device: "gta9pxxx"
            firmware: "SM-X216B/EUX/352862571234563"
          - module: "Galaxy Jump3 (m44xktt)"
            device: "m44xktt"
            firmware: "SM-M446K/KTC/350454001234561"
          # Keep the original pa2qxxx SDK36 cohort intact for legacy consumers.
          - module: "Galaxy S25+ (One UI 9.0 / SDK37 wallpapers)"
            device: "pa2qxxx-sdk37"
            firmware: "SM-S936B/EUX/35063460"
          - module: "Galaxy S21 FE 5G (Snapdragon) (r9qxxx)"
            device: "r9qxxx"
            firmware: "SM-G990B/EUX/353718681234563"
          - module: "Galaxy S21 FE 5G (Exynos) (r9sxxx)"
            device: "r9sxxx"
            firmware: "SM-G990E/THL/355798871234563"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Check One UI 9.0 firmware before downloading
        if: matrix.device == 'pa2qxxx-sdk37'
        id: sdk37
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 -A 'samsung SM-S936B SyncML DM Client' \
            'https://fota-cloud-dn.ospserver.net/firmware/EUX/SM-S936B/version.xml' \
            --output "$RUNNER_TEMP/s936b-eux-version.xml"
          python3 -B .github/update_sdk37_wallpaper.py \
            --feed "$RUNNER_TEMP/s936b-eux-version.xml" \
            --output-dir prebuilts/samsung/pa2qxxx-sdk37 >> "$GITHUB_OUTPUT"

      # Legacy rows have no sdk37 output. Skip expensive work only when the
      # existing SDK37 receipt AND all split bytes match the advertised build.
      - name: Free disk space (1/3)
        if: steps.sdk37.outputs.update != 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        if: steps.sdk37.outputs.update != 'false'
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        if: steps.sdk37.outputs.update != 'false'
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        if: steps.sdk37.outputs.update != 'false'
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev "linux-modules-extra-$(uname -r)" lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        if: steps.sdk37.outputs.update != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        if: steps.sdk37.outputs.update != 'false'
        run: |
          # The original sourced environment is checked separately.
          # shellcheck source=/dev/null
          source ./buildenv.sh a52sxq
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        if: steps.sdk37.outputs.update != 'false'
        run: ./scripts/build_dependencies.sh

      - name: Update prebuilt blobs
        if: steps.sdk37.outputs.update != 'false'
        env:
          DEVICE: ${{ matrix.device }}
          FIRMWARE: ${{ matrix.firmware }}
          EXPECTED_FIRMWARE: ${{ steps.sdk37.outputs.firmware }}
        run: |
          if [ "$DEVICE" = "pa2qxxx-sdk37" ]; then
            ./scripts/download_fw.sh --ignore-source --ignore-target "$FIRMWARE"
            ./scripts/extract_fw.sh --ignore-source --ignore-target "$FIRMWARE"
            AAPT2="$RUNNER_TEMP/sdk37-wallpaper-aapt2"
            unzip -p "$TOOLS_DIR/bin/apktool.jar" prebuilt/linux/aapt2 > "$AAPT2"
            chmod 755 "$AAPT2"
            python3 .github/update_sdk37_wallpaper.py \
              --firmware-dir "$FW_DIR/SM-S936B_EUX" \
              --output-dir "prebuilts/samsung/$DEVICE" --aapt2 "$AAPT2" \
              --expected-firmware "$EXPECTED_FIRMWARE"
          else
            ./scripts/internal/update_prebuilt_blobs.sh "$DEVICE" "$FIRMWARE"
          fi
          echo "PDA_BUILD=$(cut -d / -f 1 "prebuilts/samsung/$DEVICE/.current")" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: steps.sdk37.outputs.update != 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            prebuilts/samsung/${{ matrix.device }}
          commit-message: 'prebuilts/samsung/${{ matrix.device }}: update blobs to ${{ env.PDA_BUILD }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'prebuilts/samsung/${{ matrix.device }}'
          delete-branch: true
          draft: ${{ matrix.device == 'pa2qxxx-sdk37' }}
          title: 'Update prebuilts/samsung/${{ matrix.device }} blobs to ${{ env.PDA_BUILD }}'
          body: |
            Refresh original firmware blobs for `${{ matrix.device }}`.

            The pa2qxxx-sdk37 profile accepts only genuine SM-S936B/EUX firmware
            reporting SDK37 / One UI 90000, and a matching SDK37 wallpaper resource
            package. Its receipt records the unchanged APK and split-part hashes.
            It does not replace the legacy pa2qxxx set or automatically update ROM
            consumers; review the new catalog/app contract before integration.
